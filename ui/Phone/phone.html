<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f3f3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ViaSonic">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
__MANIFEST__
<title>ViaSonic</title>
<style>
:root {
  --bg: #f3f3f3; --card: #ffffff; --card-press: #f0f0f0; --text: #1b1b1b; --sub: #616161;
  --line: rgba(0, 0, 0, .08); --field: #ffffff; --field-line: rgba(0, 0, 0, .14);
  --accent: #1b1b1b; --accent-press: #3a3a3a; --on-accent: #ffffff; --err-bg: #fde7e9; --err: #c42b1c;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #202020; --card: #2b2b2b; --card-press: #333333; --text: #ffffff; --sub: #a6a6a6;
    --line: rgba(255, 255, 255, .07); --field: #2d2d2d; --field-line: rgba(255, 255, 255, .12);
    --accent: #ffffff; --accent-press: #d6d6d6; --on-accent: #000000; --err-bg: #442726; --err: #ff99a4;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
#app { position: fixed; top: 0; left: 0; right: 0; height: 100%; display: flex; flex-direction: column; }
header { flex: none; display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 14px) 16px 10px; }
header img { width: 28px; height: 28px; border-radius: 7px; }
header h1 { margin: 0; font-size: 20px; font-weight: 600; }
main { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 4px 16px 12px; }
main h2 { margin: 6px 4px 8px; font-size: 14px; font-weight: 600; color: var(--sub); }
#items { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.item { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  text-align: left; background: var(--card); border-radius: 8px; border: 1px solid var(--line); }
.item:active { background: var(--card-press); }
.item span { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.item svg { flex: none; width: 18px; height: 18px; color: var(--sub); }
#empty { margin: 24px 4px; color: var(--sub); text-align: center; }
#error { flex: none; margin: 0 16px 8px; padding: 10px 14px; border-radius: 8px; background: var(--err-bg); color: var(--err); font-size: 14px; }
footer { flex: none; padding: 10px 16px calc(env(safe-area-inset-bottom) + 12px); background: var(--bg); border-top: 1px solid var(--line); }
.tools { display: flex; gap: 8px; margin-bottom: 10px; }
.tool { flex: 1; height: 40px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-size: 15px; }
.tool:active { background: var(--card-press); }
form { display: flex; gap: 8px; align-items: center; margin: 0; }
#text { flex: 1; min-width: 0; height: 44px; padding: 0 14px; font: inherit; font-size: 16px; color: var(--text);
  background: var(--field); border: 1px solid var(--field-line); border-radius: 22px; outline: none; }
#text:focus { border-color: var(--accent); }
#send { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; }
#send:active { background: var(--accent-press); }
#send svg { width: 22px; height: 22px; }
form.busy #text, form.busy #send { opacity: .65; }
form.busy #text:focus { border-color: var(--field-line); }
#expired { position: fixed; inset: 0; display: grid; place-items: center; padding: 32px; text-align: center; color: var(--sub); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header><img src="icon.png" alt=""><h1>ViaSonic</h1></header>
  <main>
    <h2 id="phrases"></h2>
    <ul id="items"></ul>
    <p id="empty" hidden></p>
  </main>
  <div id="error" role="alert" hidden></div>
  <footer>
    <div class="tools">
      <button class="tool" id="stop" type="button"></button>
      <button class="tool" id="repeat" type="button"></button>
    </div>
    <form id="form" autocomplete="off">
      <input id="text" type="text" enterkeyhint="send" maxlength="500" autocomplete="off">
      <button id="send" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
      </button>
    </form>
  </footer>
</div>
<p id="expired" hidden></p>
<script>
const D = __DATA__, t = D.t;
const $ = id => document.getElementById(id);
const app = $("app"), input = $("text"), items = $("items"), error = $("error");
const LOOP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>';

input.placeholder = t.placeholder;
$("send").setAttribute("aria-label", t.send);
$("stop").textContent = t.stop;
$("repeat").textContent = t.repeat;
$("phrases").textContent = t.phrases;
$("empty").textContent = t.empty;

function expire() {
  app.hidden = true;
  $("expired").textContent = t.expired;
  $("expired").hidden = false;
}

async function api(path, init) {
  const url = path + (path.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(D.k);
  let r;
  try { r = await fetch(url, Object.assign({ cache: "no-store" }, init)); }
  catch (e) { error.textContent = t.offline; error.hidden = false; return null; }
  error.hidden = true;
  if (r.status === 403) { expire(); return null; }
  return r;
}

async function load() {
  const r = await api("/api/phrases");
  if (!r || !r.ok) return;
  const list = await r.json();
  items.replaceChildren(...list.map(p => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "item";
    const s = document.createElement("span");
    s.textContent = p.label;
    b.append(s);
    if (p.loop) b.insertAdjacentHTML("beforeend", LOOP);
    b.addEventListener("click", () => play(p.id));
    li.append(b);
    return li;
  }));
  $("empty").hidden = list.length > 0;
}

async function play(id) {
  const r = await api("/api/play?id=" + encodeURIComponent(id), { method: "POST" });
  if (r && r.status === 404) load(); // 电脑上已经删掉了这条
}

// 和电脑上的输入框一样：发送后变灰、不能编辑，电脑读完才清空。合成失败、连接断开时保留文字
let busy = false;
function setBusy(on) {
  busy = on;
  input.readOnly = on;
  $("form").classList.toggle("busy", on);
}
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  setBusy(true);
  let done = false;
  try {
    const r = await api("/api/say", { method: "POST", body: text, headers: { "Content-Type": "text/plain; charset=utf-8" } });
    if (r && r.ok) {
      const { id } = await r.json();
      const w = await fetch("/api/wait?id=" + id + "&k=" + encodeURIComponent(D.k), { cache: "no-store" });
      done = w.ok;
    }
  } catch (err) { }
  if (done) input.value = "";
  setBusy(false);
});
$("stop").addEventListener("click", () => api("/api/stop", { method: "POST" }));
$("repeat").addEventListener("click", () => api("/api/repeat", { method: "POST" }));

// 点按钮时不让输入框失去焦点，键盘就不会收起来
document.querySelectorAll("footer button").forEach(b => b.addEventListener("pointerdown", e => e.preventDefault()));

// 弹出键盘时，底部的输入框贴着键盘
const vv = window.visualViewport;
function fit() {
  if (!vv) return;
  app.style.height = vv.height + "px";
  app.style.transform = "translateY(" + vv.offsetTop + "px)";
}
if (vv) { vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); fit(); }

if (D.k) load(); else expire();
</script>
</body>
</html>
